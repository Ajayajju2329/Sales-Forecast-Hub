kind = "web"
previewPath = "/"
title = "Sales Forecasting System"
version = "1.0.0"
id = "artifacts/sales-forecasting"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22716

[services.development]
run = "pnpm --filter @workspace/sales-forecasting run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sales-forecasting", "run", "build" ]
publicDir = "artifacts/sales-forecasting/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22716"
BASE_PATH = "/"
